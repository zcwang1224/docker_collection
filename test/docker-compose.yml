services:   

  db-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: my_db
    ports:
      - "5432:5432"
    networks:
      - backend

  db-mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - backend
    ports:
      - "27017:27017"

  db-redis:
    image: redis:latest
    networks:
      - backend
    ports:
      - "6379:6379"

networks:
  backend:
    driver: bridge